; Hamster wheel desk toy: ESP32 + GC9A01 round display
; Author: DeadPohl  https://www.instagram.com/_deadpohl_
;
; Build and flash:   pio run -t upload
; Serial monitor:    pio device monitor

[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 3 MB application slot (no OTA): plenty of room for the animation
board_build.partitions = huge_app.csv
; the animation is linked into the firmware, no filesystem upload needed
board_build.embed_files = assets/animation.bin
extra_scripts = post:merge_bin.py

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bodmer/TJpg_Decoder@1.1.0

; TFT_eSPI is configured here, so its library files never need editing.
; Wiring (ESP32 GPIO):  SCL=18  SDA=23  CS=5  DC=17  RST=16
build_flags =
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=17
  -DTFT_RST=16
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
